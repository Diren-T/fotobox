<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6E0C19">
<title>Euer Foto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#6E0C19;--ink:#FBF4EE;--muted:#E8CFC9;--accent:#F4C9CD;--black:#111111}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}
body{min-height:100vh;min-height:100dvh}
button,a{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;line-height:1;letter-spacing:-.04em}
.pill{background:var(--black);color:var(--ink);padding:8px 14px;font-size:13px;font-weight:600;letter-spacing:.08em;white-space:nowrap}
.serif{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent)}
.top{border-bottom:2px solid var(--ink);padding-bottom:16px}
.print{background:#fff;border:none;box-shadow:9px 10px 0 var(--black);transform:rotate(1.2deg);line-height:0;margin:4px 8px 10px 0}
.print img{display:block;width:100%;height:auto;-webkit-touch-callout:default}
.wait{background:var(--black);border:none;box-shadow:9px 10px 0 rgba(0,0,0,.35);aspect-ratio:3/2.4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.spin{width:54px;height:54px;border-radius:50%;border:7px solid rgba(251,244,238,.2);border-top-color:var(--accent);animation:s .9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.wait b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em}
.wait span{font-size:15px;color:var(--muted);line-height:1.4;max-width:260px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:68px;border-radius:0;border:3px solid var(--ink);
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em;text-decoration:none;cursor:pointer;background:none;padding:10px 20px}
.btn svg{width:26px;height:26px;flex-shrink:0}
.btn.main{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn[disabled]{opacity:.45}
.hint{font-size:15px;line-height:1.45;color:var(--muted);text-align:center;margin:-8px 0 0}
.steps{background:var(--black);border:none;border-radius:0;padding:16px 18px;font-size:15px;line-height:1.5;display:none}
.steps.on{display:block}
.steps b{font-weight:600}
.small{font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
.err{font-size:15px;text-align:center;color:var(--accent);display:none}
.err.on{display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1>Euer <span class="serif">Foto</span></h1>
    <span class="pill">FOTOBOX</span>
  </div>

  <div class="wait" id="wait">
    <div class="spin" aria-hidden="true"></div>
    <b id="waitTitle">Gleich da …</b>
    <span id="waitText">Euer Foto wird gerade hochgeladen. Die Seite aktualisiert sich von selbst.</span>
  </div>
  <div class="print" id="print" hidden><img id="img" alt="Euer Foto aus der Fotobox"></div>

  <button class="btn main" id="save" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="#6E0C19" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
    <span id="saveLabel">Foto speichern</span>
  </button>
  <p class="hint" id="saveHint"></p>

  <div class="steps" id="steps"></div>

  <button class="btn" id="share" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="#FBF4EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    Teilen (WhatsApp &amp; Co.)
  </button>

  <p class="err" id="err"></p>
  <p class="small">Klappt nichts davon? Einfach lange auf das Foto drücken und „Bild sichern“ wählen.</p>
</main>

<script>
(function () {
  "use strict";
  // ==== Einstellungen ====
  var SUPABASE_URL = "https://lffkzuaknzeoxvvqoxzm.supabase.co";
  var BUCKET = "fotobox";
  // =======================

  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var ev = (q.get("e") || "").replace(/[^a-z0-9-]/gi, "");
  var pid = (q.get("p") || "").replace(/[^a-z0-9]/gi, "");
  var url = SUPABASE_URL + "/storage/v1/object/public/" + BUCKET + "/" + ev + "/" + pid + ".jpg";
  var name = "fotobox-" + pid + ".jpg";
  var file = null, blobUrl = null, tries = 0;

  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var inApp = /Instagram|FBAN|FBAV|Line\/|Snapchat/i.test(ua);

  function canShareFile(f) {
    try { return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [f] })); } catch (e) { return false; }
  }

  function setup() {
    if (isIOS) {
      $("saveLabel").textContent = "In Fotos sichern";
      $("saveHint").textContent = "Im nächsten Fenster auf „Bild sichern“ tippen.";
    } else {
      $("saveLabel").textContent = "Foto speichern";
      $("saveHint").textContent = "Das Foto landet in deiner Galerie (Ordner „Downloads“).";
    }
    if (inApp) {
      $("steps").innerHTML = "<b>Tipp:</b> Du bist in einer App. Öffne die Seite über <b>… → Im Browser öffnen</b>, dann klappt das Speichern am besten.";
      $("steps").classList.add("on");
    }
  }

  function showErr(t) { $("err").textContent = t; $("err").classList.add("on"); }

  function load() {
    if (!ev || !pid) {
      $("waitTitle").textContent = "Link unvollständig";
      $("waitText").textContent = "Bitte den QR-Code an der Fotobox nochmal scannen.";
      document.querySelector(".spin").style.display = "none";
      return;
    }
    fetch(url + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (r.status === 400 || r.status === 404) throw new Error("wait");
      if (!r.ok) throw new Error("http " + r.status);
      return r.blob();
    }).then(function (blob) {
      blobUrl = URL.createObjectURL(blob);
      file = new File([blob], name, { type: "image/jpeg" });
      $("img").src = blobUrl;
      $("print").hidden = false;
      $("wait").hidden = true;
      $("save").disabled = false;
      if (canShareFile(file)) $("share").hidden = isIOS;   // iOS: Speichern = Teilen-Menü
    }).catch(function () {
      tries++;
      if (tries === 15) $("waitText").textContent = "Die Fotobox hat gerade kein Netz. Das Foto kommt, sobald sie wieder online ist – diese Seite einfach offen lassen oder später nochmal öffnen.";
      setTimeout(load, tries < 15 ? 4000 : 15000);
    });
  }

  function download() {
    var a = document.createElement("a");
    a.href = blobUrl; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    $("saveLabel").textContent = "Gespeichert ✓";
    setTimeout(function () { $("saveLabel").textContent = "Foto speichern"; }, 3000);
  }

  $("save").addEventListener("click", function () {
    if (!file) return;
    if (isIOS && canShareFile(file)) {
      navigator.share({ files: [file] }).catch(function () {});
    } else if (isIOS) {
      $("steps").innerHTML = "<b>So geht's:</b> Lange auf das Foto drücken und <b>„Zu Fotos hinzufügen“</b> wählen.";
      $("steps").classList.add("on");
    } else {
      download();
    }
  });
  $("share").addEventListener("click", function () {
    if (file && canShareFile(file)) navigator.share({ files: [file] }).catch(function () {});
  });

  setup();
  load();
})();
</script>
</body>
</html>
